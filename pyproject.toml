[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "la-parking-foundation"
version = "0.1.0"
description = "Evidence-preserving Los Angeles curb and parking data foundation"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "pandas>=2.2,<3",
    "geopandas>=1.0,<2",
    "shapely>=2.0,<3",
    "pyarrow>=18,<24",
    "duckdb>=1.2,<2",
    "pydantic>=2.10,<3",
    "tzdata>=2025.1",
    "folium>=0.19,<1",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "ipykernel>=6.29,<8",
    "scikit-learn>=1.7,<2",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "pypdf>=6,<7",
    "pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
la-parking = "la_parking.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/la_parking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
