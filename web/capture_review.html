<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capture review queue</title><style>html{overflow-wrap:anywhere}*{min-width:0;box-sizing:border-box}body{font:16px/1.5 system-ui;max-width:900px;margin:auto;padding:16px}input,select,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:8px;margin:6px 0}canvas{max-width:100%;border:1px solid #aaa;touch-action:none}label{display:block}input[type=checkbox]{width:auto}</style><h1>Blinded capture review</h1><p>Local review only. Earlier counts and CV candidates are hidden. Shared visible-area masks may be reused for an independent count. Do not mark hidden curb empty, identify people/plates or treat parked vehicles as proof of legal capacity. Reserved captures are excluded.</p><select id="task"></select><p id="metadata"></p><label>Choose this capture's local image (video: supply a timestamped frame and sidecar)<input id="image" type="file" accept="image/*"></label><canvas id="canvas" width="640" height="400"></canvas><select id="tool"><option value="visible_curb">Visible curb mask</option><option value="tree">Tree occlusion</option><option value="shadow">Shadow occlusion</option><option value="other">Other occlusion</option></select><button id="clear">Clear masks</button><label>Reviewer code<input id="reviewer"></label><label>Visible scope ID (same physical curb area across raters)<input id="scope" placeholder="Full face or predeclared visible section ID"></label><label>Occupied vehicles in that visible scope<input id="count" type="number" min="0"></label><label>Fraction of complete face visible (0–1; unknown stays blank)<input id="fraction" type="number" min="0" max="1" step="0.01"></label><label><input id="full" type="checkbox"> Entire face visible, including all curb sections</label><label><input id="privacy" type="checkbox"> Privacy reviewed; no readable plates or personal identifiers in the retained image</label><label><input id="time" type="checkbox"> Exact capture time independently checked</label><label><input id="location" type="checkbox"> Face, location and side independently checked</label><label><input id="blind" type="checkbox"> I counted independently without seeing prior counts/detections</label><label>Confidence<input id="confidence" type="number" min="0" max="1" step="0.1"></label><label>Restrictions / missingness / counting convention<textarea id="notes"></textarea></label><button id="save">Save review locally</button><button id="export">Export reviews JSONL</button><p id="status" role="status"></p><script id="queue" type="application/json">/*__QUEUE__*/</script><script>
const queue=JSON.parse(document.getElementById('queue').textContent),get=id=>document.getElementById(id),canvas=get('canvas'),ctx=canvas.getContext('2d');let masks=[],picture=null,point=null,reviews=[];const key='spotless-capture-reviews-v1';try{reviews=JSON.parse(localStorage.getItem(key)||'[]');}catch{}
for(const item of queue)get('task').add(new Option(item.capture.capture_id+' · '+item.capture.block_face_id,item.capture.capture_id));
function render(){ctx.clearRect(0,0,canvas.width,canvas.height);if(picture)ctx.drawImage(picture,0,0);for(const m of masks){ctx.strokeStyle=m.kind==='visible_curb'?'green':'orange';ctx.lineWidth=3;const [x,y,a,b]=m.xyxy;ctx.strokeRect(x,y,a-x,b-y);}}
function choose(){const item=queue.find(r=>r.capture.capture_id===get('task').value);if(!item)return;get('metadata').textContent=JSON.stringify({face:item.capture.block_face_id,capture_time:item.capture.capture_at_utc,receipt:item.capture.received_at_utc,source:item.capture.source,reasons:item.reasons});masks=structuredClone(item.shared_masks||[]);picture=null;get('count').value='';get('fraction').value='';for(const id of ['full','privacy','time','location','blind'])get(id).checked=false;render();}
get('task').onchange=choose;get('image').onchange=e=>{const file=e.target.files[0];if(!file)return;const image=new Image();image.onload=()=>{picture=image;canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;render();URL.revokeObjectURL(image.src);};image.src=URL.createObjectURL(file);};
function pos(e){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(canvas.width,(e.clientX-r.left)*canvas.width/r.width)),Math.max(0,Math.min(canvas.height,(e.clientY-r.top)*canvas.height/r.height))];}
canvas.onpointerdown=e=>{point=pos(e);canvas.setPointerCapture(e.pointerId);};canvas.onpointerup=e=>{if(!point)return;const p=pos(e),v=[Math.min(point[0],p[0]),Math.min(point[1],p[1]),Math.max(point[0],p[0]),Math.max(point[1],p[1])];if(v[2]>v[0]&&v[3]>v[1])masks.push({kind:get('tool').value,xyxy:v});point=null;render();};get('clear').onclick=()=>{masks=[];render();};
get('save').onclick=()=>{try{if(!get('task').value||!get('reviewer').value.trim()||!get('scope').value.trim())throw Error('Choose a capture, reviewer code and visible-scope ID.');const count=get('count').value===''?null:Number(get('count').value),fraction=get('fraction').value===''?null:Number(get('fraction').value);if(count!==null&&(!Number.isInteger(count)||count<0)||fraction!==null&&(!Number.isFinite(fraction)||fraction<0||fraction>1)||get('full').checked&&fraction!==1)throw Error('Check counts and full-face visibility.');const row={review_id:crypto.randomUUID(),capture_id:get('task').value,reviewer_code:get('reviewer').value.trim(),reviewed_at_utc:new Date().toISOString(),independent_blind_count:get('blind').checked,human_counted:count!==null,capture_time_verified:get('time').checked,location_verified:get('location').checked,occupied_visible:count,visible_fraction:fraction,full_face_visible:get('full').checked,privacy_verified:get('privacy').checked,visible_scope_id:get('scope').value.trim(),masks,physical_capacity:null,legal_capacity:null,legal_capacity_status:'unknown',restriction_evidence:'',confidence:get('confidence').value===''?null:Number(get('confidence').value),adjudicated:false,notes:get('notes').value};if(reviews.some(r=>r.capture_id===row.capture_id&&r.reviewer_code===row.reviewer_code))throw Error('This reviewer already saved this capture; preserve conflicts for explicit review.');reviews.push(row);localStorage.setItem(key,JSON.stringify(reviews));get('status').textContent='Saved for independent review; no trusted label or model was changed.';}catch(e){get('status').textContent=e.message;}};
get('export').onclick=()=>{const url=URL.createObjectURL(new Blob([reviews.map(r=>JSON.stringify(r)).join('\n')+(reviews.length?'\n':'')],{type:'application/x-ndjson'})),a=document.createElement('a');a.href=url;a.download='capture-reviews.jsonl';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};choose();
</script>
